map $http_upgrade $anubis_managed_connection {
    default upgrade;
    "" close;
}

server {
    listen 135.181.185.155:80;
    server_name ~^device-[0-9a-f]+\.anubis\.locker$;
    return 308 https://$host$request_uri;
}

server {
    listen 135.181.185.155:443 ssl;
    server_name ~^device-[0-9a-f]+\.anubis\.locker$;
    ssl_certificate /var/www/httpd-cert/www-root/anubis.locker_le1.crtca;
    ssl_certificate_key /var/www/httpd-cert/www-root/anubis.locker_le1.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/anubis-managed-error.log warn;
    client_max_body_size 1g;

    location / {
        proxy_pass http://127.0.0.1:7106;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $anubis_managed_connection;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
