<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-src 'none'; connect-src 'none'; form-action 'none'">
  <title>SYSTEM workspace password</title>
  <style>
    body { margin: 24px; color: #e3e7ec; background: #17191d; font: 14px system-ui, sans-serif; }
    p { line-height: 1.5; }
    label { display: block; margin: 14px 0; }
    input { display: block; box-sizing: border-box; width: 100%; margin-top: 6px; padding: 8px; color: inherit; background: #252932; border: 1px solid #4b5563; }
    button { padding: 8px 16px; margin-right: 8px; }
    #status { min-height: 40px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h2>SYSTEM workspace password</h2>
  <p>This local administrator setting protects the canonical machine workspace.
    It does not change a Windows password or another user's profile.
    The existing application password is required for rotation.</p>
  <form id="password-form">
    <label>Current application password (empty only if never configured)
      <input id="old-password" type="password" maxlength="4096" autocomplete="off">
    </label>
    <label>New application password
      <input id="new-password" type="password" maxlength="4096" autocomplete="new-password" required>
    </label>
    <label>Confirm new application password
      <input id="confirm-password" type="password" maxlength="4096" autocomplete="new-password" required>
    </label>
    <button id="submit" type="submit">Save password</button>
    <button id="close" type="button">Close</button>
  </form>
  <p id="status" role="status" aria-live="polite">No password can be retrieved or reset here.</p>
  <script src="./native-password-ui.js"></script>
</body>
</html>
