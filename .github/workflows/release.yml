name: release

# Tag vX.Y.Z (must equal package.json "version")  ->  build all MVP targets
# -> create the GitHub release -> publish-self-hosted (our VPS, see docs/RELEASE.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    # Manual run from a branch only builds and keeps the artifacts; no release is created.

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      NPM_REGISTRY_URL: https://npm.anubis.locker/
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: Tag matches package.json version
      if: ${{ startsWith(github.ref, 'refs/tags/v') }}
      env:
        TAG: ${{ github.ref_name }}
      run: |
        ver="$(node -p "require('./package.json').version")"
        if [ "$TAG" != "v$ver" ]; then
          echo "::error::tag $TAG does not match package.json version $ver"
          exit 1
        fi
    - run: npm ci --legacy-peer-deps
    - name: Verify unit regressions before building release artifacts
      run: node --test --test-timeout=45000 src/test/unit-ci/*.spec.js

  win-nsis:
    needs: check
    uses: ./.github/workflows/win-nsis.yml
    secrets: inherit

  win-portable:
    needs: check
    uses: ./.github/workflows/win-portable.yml
    secrets: inherit

  win-tar:
    needs: check
    uses: ./.github/workflows/win-tar.yml
    secrets: inherit

  linux-deb-tar:
    needs: check
    uses: ./.github/workflows/linux-deb-tar.yml
    secrets: inherit

  mac-x64:
    needs: check
    uses: ./.github/workflows/mac.yml
    secrets: inherit

  mac-arm:
    needs: check
    uses: ./.github/workflows/mac-arm.yml
    secrets: inherit

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [win-nsis, win-portable, win-tar, linux-deb-tar, mac-x64, mac-arm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - uses: actions/download-artifact@v4
      with:
        path: out
        merge-multiple: true
    - name: Create GitHub release and attach assets
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        node services/prepare-release.js out release-assets "${TAG#v}"
        pre=""
        case "$TAG" in *-*) pre="--prerelease" ;; esac
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "::error::Release $TAG already exists; do not replace published binaries"; exit 1
        else
          gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --generate-notes $pre
        fi

  publish-self-hosted:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/publish-self-hosted.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
