name: web-client-publish

# Publishes the client package (src/client + src/build/web-app) to OUR npm registry
# (NPM_REGISTRY_URL / NPM_TOKEN). Trigger: tag client-vX.Y.Z (see src/build/bin/web-release) or manual.
# Existing immutable versions are verified against every assembled file, never overwritten.
on:
  push:
    tags: ['client-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
    - name: Check registry secrets
      env:
        NPM_REGISTRY_URL: ${{ secrets.NPM_REGISTRY_URL }}
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        for v in NPM_REGISTRY_URL NPM_TOKEN; do
          if [ -z "${!v}" ]; then echo "::error::secret $v is not set"; exit 1; fi
        done
        case "$NPM_REGISTRY_URL" in https://*) ;; *) echo "::error::NPM_REGISTRY_URL must be https://"; exit 1 ;; esac

    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Assemble and publish package
      env:
        NPM_REGISTRY_URL: ${{ secrets.NPM_REGISTRY_URL }}
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        CLIENT_PKG_NAME: ${{ vars.CLIENT_PKG_NAME || '@ai-security-tool/electerm-react' }}
      run: |
        node --test src/test/unit-ci/web-client-package.spec.js src/test/unit-ci/web-client-consumer.spec.js
        # Preserve the Windows publisher's archive line endings on every runner.
        source="$(mktemp -d)"
        git -c core.autocrlf=true archive HEAD | tar -x -C "$source"
        export CLIENT_ASSEMBLED_ROOT="$source/src/build/web-app"
        node "$source/src/build/bin/assemble-web-client.js"
        state="$(node --input-type=module - <<'NODE'
        import fs from 'node:fs'
        const pkg = JSON.parse(fs.readFileSync(process.env.CLIENT_ASSEMBLED_ROOT + '/package.json', 'utf8'))
        const registry = process.env.NPM_REGISTRY_URL.replace(/\/?$/, '/')
        const response = await fetch(new URL(pkg.name + '/' + pkg.version, registry), {
          redirect: 'error', signal: AbortSignal.timeout(20000)
        })
        if (![200, 404].includes(response.status)) throw new Error('Registry lookup failed: ' + response.status)
        console.log(response.status === 200 ? 'published' : 'missing')
        NODE
        )"
        if [ "$state" = published ]; then
          version="$(node -p "require(process.env.CLIENT_ASSEMBLED_ROOT + '/package.json').version")"
          consumer="$(mktemp -d)"
          npm install --prefix "$consumer" "$CLIENT_PKG_NAME@$version" --ignore-scripts \
            --registry "$NPM_REGISTRY_URL" --no-audit --no-fund --loglevel=error
          node src/build/bin/verify-web-client-consumer.js "$CLIENT_ASSEMBLED_ROOT" "$consumer/node_modules/$CLIENT_PKG_NAME"
        else
          cd "$CLIENT_ASSEMBLED_ROOT"
          trap 'rm -f .npmrc' EXIT
          host="${NPM_REGISTRY_URL#https://}"
          printf '%s\n' "//${host%/}/:_authToken=${NPM_TOKEN}" > .npmrc
          case "$CLIENT_PKG_NAME" in
            @*) echo "${CLIENT_PKG_NAME%%/*}:registry=${NPM_REGISTRY_URL}" >> .npmrc ;;
          esac
          npm publish --registry "$NPM_REGISTRY_URL" --loglevel=error
        fi
