name: win-portable

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      NPM_REGISTRY_URL: https://npm.anubis.locker/
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - uses: actions/setup-go@v6
      with:
        go-version: '1.27.3'
        cache-dependency-path: native/windows-host/go.sum
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'
    - run: npm config set legacy-peer-deps true
    - run: npm install -g node-gyp
    - run: npm install -g yarn
    - run: npm ci --legacy-peer-deps
    - run: npm run b
    - run: npm run pb

    - name: Build portable tar.gz
      shell: bash
      env:
        BUILD_NUMBER: ${{ secrets.BUILD_NUMBER }}
        WORKFLOW_NAME: win-portable
      run: |
        export ANUBIS_UPDATE_URL="$(node -p "require('./src/common/brand.config').domains.update")"
        export CSC_IDENTITY_AUTO_DISCOVERY=false
        node src/build/bin/build-win-portable

    - name: Verify packaged desktop functionality
      run: npm run test-packaged-windows

    - uses: actions/upload-artifact@v4
      with:
        name: win-portable
        path: dist/*-portable.tar.gz
        if-no-files-found: error
