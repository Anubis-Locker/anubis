name: publish-self-hosted

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release, for example v5.6.11'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-self-hosted
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_UPDATE_PATH: ${{ secrets.DEPLOY_UPDATE_PATH }}
      DEPLOY_STATE_PATH: ${{ secrets.DEPLOY_STATE_PATH }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Validate restricted deployment configuration
      env:
        DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      run: |
        set -euo pipefail
        [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Stable release tag required"; exit 1; }
        for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_UPDATE_PATH DEPLOY_STATE_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
          test -n "${!name}" || { echo "::error::Missing $name"; exit 1; }
        done
        for name in DEPLOY_PATH DEPLOY_UPDATE_PATH DEPLOY_STATE_PATH; do
          [[ "${!name}" =~ ^/[a-zA-Z0-9_/-]+$ && "${!name}" != "/" ]] || { echo "::error::Unsafe $name"; exit 1; }
        done
        [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]] || exit 1
        port="${DEPLOY_PORT:-22}"
        [[ "$port" =~ ^[0-9]+$ ]] && (( port > 0 && port < 65536 )) || exit 1
        umask 077
        mkdir -p "$RUNNER_TEMP/ssh"
        printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
        printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
        echo "SSH_COMMAND=ssh -p $port -i $RUNNER_TEMP/ssh/key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" >> "$GITHUB_ENV"

    - name: Download and verify the existing release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir out
        gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir out
        (cd out && sha256sum --check --strict SHA256SUMS)
        node services/prepare-release.js out validated "${TAG#v}"
        gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
        node - <<'NODE'
        const fs = require('node:fs')
        const assert = require('node:assert/strict')
        const brand = require('./src/common/brand.config')
        const release = JSON.parse(fs.readFileSync('release.json', 'utf8'))
        assert.equal(release.tag_name, process.env.TAG)
        assert.equal(release.draft, false)
        assert.equal(release.prerelease, false)
        const files = fs.readdirSync('validated')
        assert.equal(release.assets.length, files.length)
        for (const asset of release.assets) {
          assert.ok(files.includes(asset.name))
          assert.equal(asset.size, fs.statSync('validated/' + asset.name).size)
          asset.browser_download_url = `${brand.domains.download}/releases/${release.tag_name}/${encodeURIComponent(asset.name)}`
        }
        fs.writeFileSync('mirrored-release.json', JSON.stringify(release))
        NODE

    - name: Upload verified assets before exposing the update
      run: |
        set -euo pipefail
        remote="$DEPLOY_USER@$DEPLOY_HOST"
        $SSH_COMMAND "$remote" "mkdir -p '$DEPLOY_PATH/releases/$TAG' '$DEPLOY_STATE_PATH'"
        rsync -a -s --partial -e "$SSH_COMMAND" validated/ "$remote:$DEPLOY_PATH/releases/$TAG/"
        $SSH_COMMAND "$remote" "cd '$DEPLOY_PATH/releases/$TAG' && sha256sum --check --strict SHA256SUMS && ln -sfn 'releases/$TAG' '$DEPLOY_PATH/$TAG'"
        rsync -a -s -e "$SSH_COMMAND" services/publish-update.js mirrored-release.json "$remote:$DEPLOY_STATE_PATH/"
        $SSH_COMMAND "$remote" "node '$DEPLOY_STATE_PATH/publish-update.js' '$DEPLOY_STATE_PATH/mirrored-release.json' '$DEPLOY_UPDATE_PATH'"
        $SSH_COMMAND "$remote" "node '$DEPLOY_STATE_PATH/publish-update.js' '$DEPLOY_STATE_PATH/mirrored-release.json' '$DEPLOY_PATH'"
        got="$($SSH_COMMAND "$remote" "cat '$DEPLOY_UPDATE_PATH/version.html'")"
        test "$got" = "$TAG"
        echo "Published verified $TAG without deploying the main site or demo"
