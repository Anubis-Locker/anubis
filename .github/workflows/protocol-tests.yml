name: protocol-tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/protocol-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/app/server/**'
      - 'src/test/integration/session-loopback-acceptance.spec.js'
      - 'src/test/integration/lib/**'
  pull_request:
    paths:
      - '.github/workflows/protocol-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'src/app/server/**'
      - 'src/test/integration/session-loopback-acceptance.spec.js'
      - 'src/test/integration/lib/**'

permissions:
  contents: read

jobs:
  loopback:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      NPM_REGISTRY_URL: https://npm.anubis.locker/
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci --legacy-peer-deps
      - name: Verify real SSH, SFTP, FTP and Telnet sessions
        run: node --test --test-timeout=45000 src/test/integration/session-loopback-acceptance.spec.js
