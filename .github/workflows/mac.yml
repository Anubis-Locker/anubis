name: mac-x64

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    env:
      NPM_REGISTRY_URL: https://npm.anubis.locker/
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: pip install setuptools
    - run: npm config set legacy-peer-deps true
    - run: npm install -g yarn
    - run: npm ci --legacy-peer-deps
    - run: npm run b
    - run: npm run pb

    - name: Build dmg (signed + notarized only when secrets are set)
      env:
        BUILD_NUMBER: ${{ secrets.BUILD_NUMBER }}
        WORKFLOW_NAME: mac-x64
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        export ANUBIS_UPDATE_URL="$(node -p "require('./src/common/brand.config').domains.update")"
        if [ -z "$CSC_LINK" ]; then
          echo "::warning::CSC_LINK is not set - macOS build is UNSIGNED and NOT notarized"
          unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          node -e "const f='electron-builder.json',fs=require('fs'),j=JSON.parse(fs.readFileSync(f,'utf8'));j.mac.identity=null;j.mac.notarize=false;j.mac.hardenedRuntime=false;fs.writeFileSync(f,JSON.stringify(j,null,2))"
        elif [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
          echo "::warning::APPLE_* not set - build is signed but NOT notarized"
          node -e "const f='electron-builder.json',fs=require('fs'),j=JSON.parse(fs.readFileSync(f,'utf8'));j.mac.notarize=false;fs.writeFileSync(f,JSON.stringify(j,null,2))"
        fi
        node src/build/bin/build-mac

    - uses: actions/upload-artifact@v4
      with:
        name: mac-x64
        path: dist/*.dmg
        if-no-files-found: error
